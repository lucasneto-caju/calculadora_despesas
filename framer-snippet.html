<!--
  Cole este código no Framer, na página da LP: Page Settings → Custom Code → "End of <body> tag".
  Não precisa alterar nada nele.

  Para que serve: dependendo de como o Framer roda o HTML colado no Embed, a calculadora
  pode ficar num quadro isolado que não enxerga a URL nem os cookies da LP. Este script lê
  as UTMs da URL da LP e o client id do Google Analytics (cookie _ga) e entrega para a
  calculadora quando ela pedir. Se a calculadora conseguir ler esses dados sozinha,
  o script simplesmente não é usado. Mantê-lo instalado não causa problema.

  Também faz o download do PDF do resultado quando o quadro não tem permissão para isso,
  e repassa os eventos da calculadora (calc_*) para o GA da LP (dataLayer do GTM ou gtag).

  Só responde a quadros (iframes) que estão nesta página, e só envia UTMs, client id do GA
  e a URL da página. Nenhum dado pessoal.
-->
<script>
(function () {
  var KEY = 'caju_calc_utms';

  // UTMs da URL atual; se a pessoa navegou e a URL não tem mais UTMs, usa as da entrada.
  var utms = {};
  try {
    new URLSearchParams(location.search).forEach(function (v, k) {
      if (/^utm_/i.test(k) && v) utms[k.toLowerCase()] = v;
    });
    if (Object.keys(utms).length) sessionStorage.setItem(KEY, JSON.stringify(utms));
    else utms = JSON.parse(sessionStorage.getItem(KEY) || '{}');
  } catch (e) {}

  function gaClientId() {
    var m = document.cookie.match(/(?:^|;\s*)_ga=([^;]+)/);
    if (!m) return '';
    var p = decodeURIComponent(m[1]).split('.');
    return p.length >= 4 ? p.slice(-2).join('.') : '';
  }

  function ehQuadroDaPagina(win) {
    var frames = document.getElementsByTagName('iframe');
    for (var i = 0; i < frames.length; i++) {
      if (frames[i].contentWindow === win) return true;
    }
    return false;
  }

  // Download do PDF feito pela LP, para o caso de o quadro não ter permissão de download.
  function baixarPdf(blob) {
    if (!(blob instanceof Blob) || blob.type !== 'application/pdf' || blob.size > 5 * 1024 * 1024) return;
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'custo-invisivel-despesas-caju.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // Repassa os eventos da calculadora para o GA da LP.
  // Com GTM: vão para o dataLayer (crie no GTM os acionadores "Evento personalizado").
  // Sem GTM, só com gtag.js: vão direto como eventos do GA4.
  function repassarEvento(p) {
    if (!p || typeof p.event !== 'string' || !/^calc_[a-z_]+$/.test(p.event)) return;
    var params = {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (k !== 'event' && /^calc_[a-z_]+$/.test(k) && (typeof v === 'number' || typeof v === 'boolean' || typeof v === 'string')) {
        params[k] = typeof v === 'string' ? v.slice(0, 100) : v;
      }
    });
    var temGTM = false;
    try { temGTM = Object.keys(window.google_tag_manager || {}).some(function (k) { return k.indexOf('GTM-') === 0; }); } catch (e) {}
    if (temGTM || typeof window.gtag !== 'function') {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(Object.assign({ event: p.event }, params));
    } else {
      window.gtag('event', p.event, params);
    }
  }

  window.addEventListener('message', function (e) {
    if (!e.data || !ehQuadroDaPagina(e.source)) return;
    if (e.data.type === 'caju-calc-pdf') { baixarPdf(e.data.pdf); return; }
    if (e.data.type === 'caju-calc-event') { repassarEvento(e.data.payload); return; }
    if (e.data.type !== 'caju-calc-ready') return;
    // '*' porque o quadro do Embed pode não ter endereço próprio (origem "null").
    e.source.postMessage({
      type: 'caju-calc-context',
      utms: utms,
      gaClientId: gaClientId(),
      pageUrl: location.href
    }, '*');
  });
})();
</script>
